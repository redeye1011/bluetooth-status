name: macOS tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run macOS tests
        run: xcodebuild test -project BluetoothStatus.xcodeproj -scheme BluetoothStatus -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO -quiet
